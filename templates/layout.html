<!DOCTYPE html>
<html lang="en">

<head>
    <!-- metas -->
    <meta charset="utf-8">
    <meta name="author" content="pxdraft">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="keywords" content="Tapsi - Portfolio Template">
    <meta name="description" content="Tapsi - Portfolio Template">
    <!-- title -->
    <title>
        {% block title %}
        {% endblock %}
    </title>
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <!-- theme css -->
    <link id="bootstrap" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="./static/css/style.css" rel="stylesheet">
</head>

<body>
<ul class="main-menu">
    <li>
        <a data-scroll-nav="0" href="/">
            <span class="m-icon">
                <i class="bi-house-door"></i>
            </span>
            <span class="m-text">Home</span>
        </a>
    </li>
    <li>
        <a data-scroll-nav="1" href="/blog">
            <span class="m-icon">
                <i class="bi-person"></i>
            </span>
            <span class="m-text">Blog</span>
        </a>
    </li>
    <li>
        <a data-scroll-nav="3" href="/login">
            <span class="m-icon">
                <i class="bi-columns"></i>
            </span>
            <span class="m-text">Login</span>
        </a>
    </li>
    <li>
        <a data-scroll-nav="4" href="/contact">
            <span class="m-icon">
                <i class="bi-telephone"></i>
            </span>
            <span class="m-text">Contact</span>
        </a>
    </li>
</ul>
</body>

{% block content %}


{% endblock %}
